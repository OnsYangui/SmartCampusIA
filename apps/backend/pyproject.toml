[project]
name = "smartcampus-backend"
version = "0.1.0"
description = "SmartCampus AI — API FastAPI (socle technique)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "langgraph>=1.2.20",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations embed long SQL statements.
"migrations/versions/*" = ["E501"]
