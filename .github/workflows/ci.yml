name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Throwaway credentials for the disposable CI database only; never reused locally.
    env:
      DATABASE_URL: postgresql+psycopg://smartcampus_app:ci_app_test@localhost:5433/smartcampus
      MIGRATION_DATABASE_URL: postgresql+psycopg://smartcampus_owner:ci_owner_test@localhost:5433/smartcampus
    defaults:
      run:
        working-directory: apps/backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: smartcampus
          POSTGRES_PASSWORD: ci_superuser_test
          POSTGRES_DB: smartcampus
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U smartcampus" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Roles, test database and pgvector (SA-16)
        working-directory: infra/postgres/init
        env:
          PGPASSWORD: ci_superuser_test
        run: >-
          psql -h localhost -p 5433 -U smartcampus -d smartcampus
          -v owner_password=ci_owner_test -v app_password=ci_app_test
          -v readonly_password=ci_readonly_test -v app_db=smartcampus -f roles.psql
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
